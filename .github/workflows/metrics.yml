
name: GitHub Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Lifetime statistics
      - name: Generate lifetime statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: clairemuthoni
          filename: github-stats.svg
          base: header
          base_indepth: yes
          config_timezone: Africa/Nairobi

      # 2. Current calendar year contributions
      - name: Generate 2026 contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: clairemuthoni
          filename: github-activity.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Africa/Nairobi

      # 3. Programming languages
      - name: Generate programming languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: clairemuthoni
          filename: github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          repositories_forks: no
          repositories_affiliations: owner
          config_timezone: Africa/Nairobi
